<title>Neston UGCS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Tema único claro. Camada executiva no topo, camada analítica recolhida abaixo. */
:root{
  --bg:#ffffff; --surface:#ffffff; --band:#fffaef; --surface-2:#f1f5ec;
  --line:rgba(3,83,29,.22); --line-soft:rgba(3,83,29,.11);
  --ink:#03531d; --ink-2:#3f5c48; --ink-3:#5d7a66;
  --accent:#0f8e44; --accent-soft:#e8f4ea; --accent-ink:#007337;
  --amarelo:#f4ea00; --broto:#96d555;
  --d:#03531d;
  --shadow:0 2px 6px rgba(3,83,29,.07), 0 10px 26px rgba(3,83,29,.07);
  --shadow-lg:0 4px 12px rgba(3,83,29,.09), 0 18px 44px rgba(3,83,29,.10);
  --sticker:3px 4px 0 rgba(3,83,29,.20);
  --s1:#0f8e44; --s2:#f88b00; --s3:#c4001a; --s4:#a09400;
  --q1:#4ab86b; --q2:#23984e; --q3:#00803a; --q4:#00682c; --q5:#03531d;
  --r-sm:6px; --r-md:16px; --r-lg:28px;
  --ff-display:'Lilita One','Arial Black',Impact,sans-serif;
  --ff-body:Nunito,'Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ff-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1140px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--ff-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.3px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink-3);margin:0}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ===== capa ===== */
header{position:relative;background:var(--band);overflow:hidden}
.ribbons{position:absolute;left:0;right:0;bottom:0;width:100%;height:92px;z-index:0}
.head{position:relative;z-index:1;padding-block:30px 118px}
.head-top{display:flex;flex-wrap:wrap;gap:20px 28px;align-items:center;justify-content:space-between;margin-bottom:38px}
.head-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:40px;align-items:end}
@media(max-width:760px){.head-main{grid-template-columns:1fr;gap:22px}}
.brandmark img{display:block;width:172px;height:auto}
.meta{font-size:13px;color:var(--ink-2);text-align:right;font-weight:700;line-height:1.8;flex:none}
.meta b{color:var(--ink);font-weight:800}
@media(max-width:640px){.meta{text-align:left}}
.plaque{display:inline-block;background:var(--accent);color:var(--amarelo);padding:10px 20px 13px;border-radius:var(--r-sm);
  transform:rotate(-2.5deg);box-shadow:var(--sticker);font-family:var(--ff-display);
  font-size:clamp(25px,4.2vw,40px);line-height:1;text-transform:uppercase;letter-spacing:.6px}
.lede{font-family:var(--ff-display);font-size:clamp(28px,4.9vw,58px);line-height:1.08;margin:0}
.lede em{font-style:normal;color:var(--accent-ink)}
.lede-sub{font-size:17px;font-weight:700;color:var(--ink-2);margin:16px 0 0;max-width:52ch}
/* assinatura da agência no pé da capa */
.head-right{display:flex;flex-direction:column;align-items:flex-end;gap:20px}
.head-publi{display:block;width:136px;height:auto;opacity:.9}
@media(max-width:640px){.head-right{align-items:flex-start}}

/* ===== trilho ===== */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(255,255,255,.96);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.rail-in{padding-block:11px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.ctl{display:flex;flex-wrap:wrap;gap:7px;align-items:center;min-width:0}
.ctl>.eyebrow{font-size:10px;letter-spacing:1px;margin-right:2px}
button{font:inherit;cursor:pointer}
.pill{font-size:12px;font-weight:800;padding:6px 13px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--ink-2);transition:all .13s}
.pill:hover{border-color:var(--accent);color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.pill span{font-weight:600;opacity:.8}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 12px 5px 9px;
  border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink-2)}
.chip .dot{width:9px;height:9px;border-radius:3px;background:currentColor;flex:none}
.chip[aria-pressed="true"]{border-color:var(--ink-3);background:var(--surface-2);color:var(--ink)}
.chip[aria-pressed="false"]{opacity:.42}
.reset{border:none;background:none;color:var(--accent-ink);font-size:12px;font-weight:800;text-decoration:underline;text-underline-offset:3px}

/* ===== seções ===== */
section{padding-block:52px}
section.band{background:var(--band)}
.sh{margin-bottom:26px;max-width:58ch}
.sh h2{font-size:clamp(23px,3.1vw,33px);margin-top:9px;line-height:1.1}
.sh p{margin:11px 0 0;color:var(--ink-2);font-size:15px;font-weight:600}

/* ===== kpis ===== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.kpi{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:22px 24px 24px;
  display:flex;flex-direction:column;gap:5px;min-width:0;border:1px solid var(--line-soft)}
.kpi .k{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3)}
.kpi .v{font-family:var(--ff-display);font-size:clamp(34px,4.6vw,46px);line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.kpi .s{font-size:12.5px;color:var(--ink-3);line-height:1.4;font-weight:600}
.rates{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:16px}
.rate{background:var(--accent);color:#fff;border-radius:var(--r-lg);padding:20px 24px 22px;box-shadow:var(--shadow)}
.rate .k{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.85)}
.rate .v{font-family:var(--ff-display);font-size:clamp(30px,4vw,40px);line-height:1.05;color:var(--amarelo);font-variant-numeric:tabular-nums}
.rate .s{font-size:12.5px;color:rgba(255,255,255,.88);font-weight:600}


/* ===== entrega contra o estimado ===== */
.goal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);border:1px solid var(--line-soft);padding:28px 30px 30px}
.goal-head{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
.goal-head .big{font-family:var(--ff-display);font-size:clamp(40px,6vw,62px);line-height:.95;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.goal-head .big small{display:block;font-family:var(--ff-body);font-size:13px;font-weight:800;letter-spacing:.6px;
  text-transform:uppercase;color:var(--ink-3);margin-top:9px}
.goal-head .side{font-size:13.5px;font-weight:700;color:var(--ink-2);text-align:right;line-height:1.6}
.goal-head .side b{font-family:var(--ff-display);font-weight:400;font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums}
@media(max-width:620px){.goal-head .side{text-align:left}}
.gbar{margin-bottom:18px}
.gbar .gl2{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;font-weight:800;color:var(--ink-2);margin-bottom:7px}
.gbar .gl2 span.r{font-variant-numeric:tabular-nums;color:var(--ink)}
.gtrack{position:relative;display:block;height:26px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.gfill{display:block;height:26px;border-radius:999px}
.gbar .foot{font-size:11.5px;color:var(--ink-3);font-weight:600;margin:6px 0 0}
.goal-note{margin:22px 0 0;padding-top:18px;border-top:1px solid var(--line-soft);font-size:13.5px;color:var(--ink-2);font-weight:600;line-height:1.55}
.goal-note b{color:var(--ink);font-weight:800}
.goal-partial{margin:18px 0 0;font-size:13px;color:var(--ink-3);font-weight:600;line-height:1.6;max-width:92ch}
.goal-partial b{color:var(--ink-2);font-weight:800}
.goal-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:18px}
.gc{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);border:1px solid var(--line-soft);padding:20px 22px 22px}
.gc .v{font-family:var(--ff-display);font-size:34px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.gc .k{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.gc .s{font-size:12.5px;color:var(--ink-3);font-weight:600;line-height:1.45;margin-top:5px;display:block}

/* ===== leitura ===== */
.reads{display:grid;gap:18px}
.read{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:26px 28px;
  display:grid;grid-template-columns:minmax(132px,170px) 1fr;gap:26px;align-items:center;border:1px solid var(--line-soft)}
.read .big{font-family:var(--ff-display);font-size:clamp(38px,5.6vw,56px);line-height:.98;color:var(--accent-ink);
  font-variant-numeric:tabular-nums}
.read .big small{display:block;font-family:var(--ff-body);font-size:12px;font-weight:800;letter-spacing:.7px;
  text-transform:uppercase;color:var(--ink-3);margin-top:7px;line-height:1.3}
.read .txt h3{font-size:19px;margin-bottom:7px}
.read .txt p{margin:0;font-size:14.5px;color:var(--ink-2);font-weight:600;line-height:1.55}
.read .txt p b{color:var(--ink);font-weight:800}
@media(max-width:620px){.read{grid-template-columns:1fr;gap:14px}}

/* ===== duelo de formatos ===== */
.duel{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:700px){.duel{grid-template-columns:1fr}}
.duelc{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:26px 26px 28px;border:1px solid var(--line-soft)}
.duelc .tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--ff-display);font-size:21px;
  padding:5px 15px 7px;border-radius:999px;color:#fff}
.duelc .role{font-size:12.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-3);margin:15px 0 16px}
.duelbars{display:flex;flex-direction:column;gap:15px}
.duelbar .dl{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.duelbar .dl b{font-family:var(--ff-display);font-weight:400;font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums}
.duelbar .dt{display:block;height:16px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.duelbar .df{display:block;height:16px;border-radius:999px}
.duelc .note{margin:19px 0 0;font-size:13.5px;color:var(--ink-2);font-weight:600;line-height:1.5}

/* ===== cartões de destaque ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(246px,1fr));gap:16px}
.hcard{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:20px 21px 22px;
  display:flex;flex-direction:column;gap:9px;border:1px solid var(--line-soft);min-width:0}
.hcard .rank{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#fff;
  background:var(--accent);border-radius:999px;padding:4px 11px;align-self:flex-start}
.hcard .big{font-family:var(--ff-display);font-size:35px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.hcard .big span{font-size:14px;font-family:var(--ff-body);font-weight:800;color:var(--ink-3);margin-left:5px}
.hcard .who{font-size:14.5px;font-weight:800;line-height:1.3;color:var(--ink)}
.hcard .who em{display:block;font-style:normal;font-size:11.5px;font-weight:600;color:var(--ink-3);margin-top:2px}
.hcard .facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.fact{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.hcard a.go{margin-top:auto;padding-top:10px;font-size:12px;font-weight:800;color:var(--accent-ink);text-decoration:none}
.hcard a.go:hover{text-decoration:underline}

/* ===== cartões e gráficos ===== */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:22px 24px 24px;min-width:0}
section.band .card{background:var(--surface)}
.card h3{font-size:18px}
.card .cap{font-size:13px;color:var(--ink-2);margin:6px 0 17px;line-height:1.5;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-bottom:15px}
.lg{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);font-weight:700}
.lg i{width:11px;height:11px;border-radius:3px;flex:none}
svg{display:block;max-width:100%;overflow:visible}
.gl{stroke:var(--line-soft);stroke-width:1.5}
.ax{fill:var(--ink-3);font-family:var(--ff-body);font-size:12px;font-weight:700}
.vl{fill:var(--ink);font-family:var(--ff-body);font-size:13.5px;font-weight:800}
.vl.sm{fill:var(--ink-2);font-size:12.5px}
.hit{fill:transparent;cursor:pointer}
.col rect.seg{stroke:var(--surface);stroke-width:2}
.hb{display:flex;flex-direction:column;gap:11px}
.hb-row{display:grid;grid-template-columns:minmax(72px,124px) 1fr minmax(60px,auto);gap:12px;align-items:center;font-size:12.5px}
.hb-row .lbl{color:var(--ink-2);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hb-track{display:block;height:14px;background:var(--surface-2);border-radius:999px;overflow:hidden;min-width:0}
.hb-fill{display:block;height:14px;border-radius:999px}
.hb-row .val{font-size:11.5px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}

/* ===== tooltip ===== */
#tip{position:fixed;z-index:90;pointer-events:none;opacity:0;transition:opacity .09s;background:var(--d);color:#fffaef;
  border-radius:10px;padding:11px 13px;font-size:12px;font-weight:600;line-height:1.5;max-width:256px;box-shadow:var(--shadow-lg)}
#tip b{font-family:var(--ff-display);font-weight:400;font-size:14.5px;display:block;margin-bottom:5px}
#tip .tr{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
#tip .tr i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px}
#tip .tn{opacity:.75}

/* ===== recolhíveis ===== */
details.more{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-top:18px;box-shadow:var(--shadow)}
details.more>summary{list-style:none;cursor:pointer;padding:19px 24px;display:flex;align-items:center;
  justify-content:space-between;gap:14px;font-family:var(--ff-display);font-size:18px;color:var(--ink);border-radius:var(--r-lg)}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary .hint{font-family:var(--ff-body);font-size:12.5px;font-weight:700;color:var(--ink-3);text-align:right}
details.more>summary::after{content:"+";font-family:var(--ff-display);font-size:24px;color:var(--accent);line-height:1;flex:none}
details.more[open]>summary::after{content:"–"}
details.more[open]>summary{border-bottom:1px solid var(--line-soft);border-radius:var(--r-lg) var(--r-lg) 0 0}
.more-body{padding:22px 24px 26px}
.more-body>.grid2+.grid2,.more-body>.card+.card{margin-top:18px}

/* ===== tabelas ===== */
.tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:16px;border-bottom:1.5px solid var(--line);padding-bottom:0}
.tab{background:none;border:none;border-bottom:3px solid transparent;padding:8px 2px 9px;margin-right:18px;font-size:13.5px;font-weight:800;color:var(--ink-3)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
th,td{text-align:right;padding:9px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
th{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-3);font-weight:800;border-bottom:1.5px solid var(--line)}
td:first-child,th:first-child,td.name,th.name{text-align:left}
td.name{white-space:normal;min-width:168px;font-weight:700}
td.name .hdl{display:block;font-size:11px;color:var(--ink-3);font-weight:600;margin-top:1px}
tbody tr:hover{background:var(--surface-2)}
.rk{font-family:var(--ff-display);font-size:15px;color:var(--ink-3);width:26px;font-variant-numeric:tabular-nums}
.pin{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;vertical-align:1px}
.minibar{display:block;height:5px;border-radius:3px;margin-top:5px;background:var(--accent)}
.tbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:15px}
.tbar input[type=search]{font:inherit;font-size:13.5px;font-weight:600;padding:9px 14px;border:1.5px solid var(--line);
  border-radius:999px;background:var(--surface);color:var(--ink);min-width:min(260px,100%);flex:0 1 260px}
.tbar input[type=search]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.tcount{font-size:12px;color:var(--ink-3);font-weight:700}
th.s{cursor:pointer;user-select:none;white-space:nowrap}
th.s:hover{color:var(--ink)}
th.s[data-on="1"]{color:var(--accent-ink)}
th.s[data-on="1"]::after{content:" ↓"}
th.s[data-on="2"]::after{content:" ↑"}
#t-all{min-width:1180px}
#t-all td.name{min-width:190px}
.tall{max-height:min(66vh,620px);overflow:auto;border:1px solid var(--line);border-radius:var(--r-md)}
.tall thead th{position:sticky;top:0;z-index:2;background:var(--surface);box-shadow:inset 0 -1.5px 0 var(--line)}
td.links{text-align:left;white-space:normal;min-width:150px}
.plink{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:4px 10px;margin:2px 4px 2px 0;
  border:1.5px solid var(--line);border-radius:999px;color:var(--accent-ink);text-decoration:none;background:var(--surface);white-space:nowrap}
.plink:hover{border-color:var(--accent);background:var(--accent-soft)}
.nolink{font-size:11px;color:var(--ink-3);font-weight:600}

/* ===== funil ===== */
.fn{display:flex;flex-direction:column;gap:9px}
.fn-step{display:grid;grid-template-columns:minmax(78px,96px) 1fr minmax(92px,auto);gap:13px;align-items:center}
.fn-lbl{font-size:13px;font-weight:800;color:var(--ink)}
.fn-trk{display:block;min-width:0}
.fn-bar{display:block;height:32px;border-radius:999px;min-width:4px}
.fn-side{font-size:11.5px;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums;line-height:1.3;font-weight:600}
.fn-side b{display:block;font-family:var(--ff-display);font-size:17px;color:var(--ink);font-weight:400}

/* ===== rodapé ===== */
footer{background:var(--band);border-top:1px solid var(--line);padding-block:40px 52px;margin-top:8px}
.gl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:18px 32px;margin-top:20px}
.gi{border-top:1px solid var(--line);padding-top:13px}
.gi dt{font-family:var(--ff-display);font-size:15px;color:var(--ink)}
.gi dd{margin:5px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.55;font-weight:600}
.gi dd code{font-family:var(--ff-body);font-weight:800;font-size:12px;color:var(--ink);background:var(--accent-soft);
  border:1px solid var(--line-soft);padding:2px 7px;border-radius:999px}
.fnote{margin-top:28px;padding-top:19px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);line-height:1.65;max-width:84ch;font-weight:600}
/* assinatura da agência: marca Publination no original, nunca redesenhada */
.sign{display:flex;align-items:center;gap:18px;margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}

</style>


<script>
window.__BOOT__ = function(){
"use strict";
const D = window.__NESTON__;
const CR = D.creators, PO = D.posts;

/* ---------- formato ---------- */
const FORDER = ['Reels','Stories','Carrossel','Foto','TikTok','Shorts'];
/* Shorts e Carrossel somam 3 publicações: nos gráficos entram como "Outros" para a paleta
   ficar com quatro cores bem separadas; as tabelas mantêm os cinco formatos abertos. */
const GORDER = ['Reels','Stories','Feed','TikTok e Shorts'];
/* Shorts entra com TikTok (vídeo curto fora do Instagram, ambos sem alcance na API);
   Carrossel e Foto viram Feed. */
const gof = f => f==='Shorts' ? 'TikTok e Shorts'
               : f==='TikTok' ? 'TikTok e Shorts'
               : ['Carrossel','Foto'].includes(f) ? 'Feed' : f;
/* nesta ordem, verde → laranja → vermelho → dourado é a sequência que passa nos testes de daltonismo */
const GCOL = {Reels:'var(--s1)',Stories:'var(--s2)',Feed:'var(--s3)','TikTok e Shorts':'var(--s4)'};
const FCOL = {Reels:'var(--s1)',Stories:'var(--s2)',Carrossel:'var(--s3)',Foto:'var(--s3)',TikTok:'var(--s4)',Shorts:'var(--s4)'};
const VIDEO = new Set(['Reels','TikTok','Shorts','Carrossel','Foto']);
const DAYS = [...new Set(PO.map(p=>p.d))].sort();
const N = new Intl.NumberFormat('pt-BR');
const n0 = v => N.format(Math.round(v||0));
const n1 = v => (v==null||!isFinite(v)) ? '—' : v.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
const pc = (v,d) => (v==null||!isFinite(v)) ? '—' : (v*100).toLocaleString('pt-BR',{minimumFractionDigits:d==null?1:d,maximumFractionDigits:d==null?1:d})+'%';
const BRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const BRL2 = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:2});
const FX = D.fx;
const money = v => { const b=(v||0)*FX; return b>=1 ? BRL.format(Math.round(b)) : BRL2.format(b); };
/* valores que já estão em real (orçamento aprovado), sem conversão */
const CACHE = D.goal.creator / D.goal.ugcN;   // cachê real por criador, com imposto e cashin
const brl = v => (v||0)>=100 ? BRL.format(Math.round(v)) : BRL2.format(v||0);
const dShort = s => { const [y,m,d]=s.split('-'); return d+'/'+m; };
const dLong = s => { const [y,m,d]=s.split('-'); return d+'/'+m+'/'+y; };
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);

/* compartilhamentos descartados quando a plataforma devolve valor impossível (acima de 20% das views) */
const shares = p => p.q.includes('s') ? 0 : p.sh;
/* engajamento: Stories = respostas + compartilhamentos; demais = curtidas + comentários + salvamentos + compartilhamentos */
function eng(p){ return p.f==='Stories' ? (p.re + shares(p)) : (p.li + p.co + p.sa + shares(p)); }
/* alcance confiável: só entra no cálculo de taxas quando a plataforma reportou e o dado não está defasado */
const okReach = p => p.r!=null && !p.q.includes('l');

/* ---------- estado ---------- */
/* semanas cheias de segunda a domingo, geradas a partir da própria base:
   quando a exportação crescer, os botões aparecem sozinhos */
const PRESETS = (()=>{
  const ini = new Date(DAYS[0]+'T00:00:00');
  const out = [{k:'all', l:'Campanha completa', sub:`${dShort(DAYS[0])} a ${dShort(DAYS[DAYS.length-1])}`, a:0, b:DAYS.length-1}];
  const g = new Map();
  DAYS.forEach((d,i)=>{
    const sem = Math.floor((new Date(d+'T00:00:00')-ini)/864e5/7)+1;
    if(!g.has(sem)) g.set(sem,[i,i]); else g.get(sem)[1]=i;
  });
  for(const [sem,[a,b]] of [...g.entries()].sort((x,y)=>x[0]-y[0]))
    out.push({k:'w'+sem, l:'Semana '+sem, sub:`${dShort(DAYS[a])} a ${dShort(DAYS[b])}`, a, b});
  return out;
})();
const S = { a:0, b:DAYS.length-1, fmts:new Set(GORDER), vTab:'views', cTab:'posts',
            aSort:'v', aDir:-1, q:'' };

/* ---------- derivação ---------- */
function derive(){
  const d0 = DAYS[S.a], d1 = DAYS[S.b];
  const rows = PO.filter(p => p.d>=d0 && p.d<=d1 && S.fmts.has(gof(p.f)));
  const out = {d0,d1,rows,days:DAYS.slice(S.a,S.b+1)};
  let v=0,r=0,e=0,emv=0, li=0,co=0,sa=0,sh=0,re=0;
  const cset = new Set();
  for(const p of rows){
    v+=p.v; e+=eng(p); emv+=p.emv; cset.add(p.c);
    li+=p.li; co+=p.co; sa+=p.sa; re+=p.re; sh+=shares(p);
    if(p.r!=null) r+=p.r;
  }
  Object.assign(out,{views:v,reach:r,engs:e,emv,creators:cset.size,posts:rows.length,
    parts:{li,co,sa,sh,re}});
  /* taxas: só sobre linhas com alcance confiável */
  let rr=0, rf=0, ee=0;
  for(const p of rows){ if(!okReach(p)) continue; rr+=p.r; rf+=p.fo; ee+=eng(p); }
  out.txa = rf ? rr/rf : null;
  out.txe = rr ? ee/rr : null;

  /* por formato */
  out.byFmt = FORDER.map(f=>{
    const g = rows.filter(p=>p.f===f);
    let v=0,r=0,e=0,rOk=0,foOk=0,eOk=0;
    for(const p of g){ v+=p.v; e+=eng(p); if(p.r!=null) r+=p.r;
      if(okReach(p)){ rOk+=p.r; foOk+=p.fo; eOk+=eng(p); } }
    return {f,n:g.length,views:v,reach:r,engs:e,
      txa: foOk? rOk/foOk : null, txe: rOk? eOk/rOk : null,
      hasReach: g.some(p=>p.r!=null)};
  }).filter(x=>x.n>0);

  /* por grupo de gráfico */
  out.byGrp = GORDER.map(gname=>{
    const g = rows.filter(p=>gof(p.f)===gname);
    let v=0,r=0,e=0,rOk=0,foOk=0,eOk=0;
    for(const p of g){ v+=p.v; e+=eng(p); if(p.r!=null) r+=p.r;
      if(okReach(p)){ rOk+=p.r; foOk+=p.fo; eOk+=eng(p); } }
    return {f:gname,n:g.length,views:v,reach:r,engs:e,
      txa: foOk? rOk/foOk : null, txe: rOk? eOk/rOk : null,
      small: g.length<5, hasReach:g.some(p=>p.r!=null)};
  }).filter(x=>x.n>0);

  /* por dia */
  out.byDay = out.days.map(d=>{
    const g = rows.filter(p=>p.d===d);
    const seg = {}; let tot=0;
    for(const f of GORDER){ const s=g.filter(p=>gof(p.f)===f).reduce((a,p)=>a+p.v,0); if(s) seg[f]=s; tot+=s; }
    return {d,seg,views:tot,n:g.length};
  });
  return out;
}

/* ---------- tooltip ---------- */
const tip = $('tip');
function showTip(ev, html){
  tip.innerHTML = html; tip.style.opacity = 1;
  const r = tip.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY - r.height - 12;
  if(x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
  if(x < 8) x = 8;
  if(y < 8) y = ev.clientY + 18;
  tip.style.left = x+'px'; tip.style.top = y+'px';
}
function hideTip(){ tip.style.opacity = 0; }
document.addEventListener('scroll', hideTip, {passive:true});

function bindTip(el, html){
  el.addEventListener('pointerenter', e=>showTip(e,html));
  el.addEventListener('pointermove', e=>showTip(e,html));
  el.addEventListener('pointerleave', hideTip);
  el.addEventListener('pointerdown', e=>showTip(e,html));
}
const trow = (c,l,val) => `<div class="tr"><span>${c?`<i style="background:${c}"></i>`:''}${l}</span><span>${val}</span></div>`;

/* ---------- SVG helpers ---------- */
const NS='http://www.w3.org/2000/svg';
/* largura real do container: evita o SVG esticar e os rótulos ficarem maiores que o texto */
function hostW(el, fb){ const w = el && el.clientWidth; return (w && w>120) ? Math.round(w) : fb; }
function svg(w,h){ const s=document.createElementNS(NS,'svg'); s.setAttribute('viewBox',`0 0 ${w} ${h}`); s.setAttribute('width','100%'); s.setAttribute('preserveAspectRatio','xMinYMin meet'); s.style.height='auto'; return s; }
function el(t,at,p){ const e=document.createElementNS(NS,t); for(const k in at) e.setAttribute(k,at[k]); if(p) p.appendChild(e); return e; }
function txt(s,x,y,cls,anchor,p){ const t=el('text',{x,y,class:cls||'ax'},p); if(anchor) t.setAttribute('text-anchor',anchor); t.textContent=s; return t; }

/* ================= KPIs ================= */
function renderKpis(A){
  const same = A.d0===A.d1;
  const full = (S.a===0 && S.b===DAYS.length-1 && S.fmts.size===GORDER.length);
  $('kpi-title').textContent = full ? 'A campanha em números' : 'O recorte em números';
  $('kpi-sub').textContent = (same?dLong(A.d0):`${dLong(A.d0)} a ${dLong(A.d1)}`)
    + ` · ${A.days.length} ${A.days.length===1?'dia':'dias'} · ${A.byGrp.map(x=>x.f).join(', ')||'nenhum formato'}`;

  /* chamada da capa */
  $('lede').innerHTML = A.posts
    ? `<em>${n0(A.views)}</em> visualizações e <em>${n0(A.reach)}</em> pessoas alcançadas.`
    : 'Nenhuma publicação no recorte.';
  $('lede-sub').textContent = A.posts
    ? `${n0(A.posts)} publicações de ${n0(A.creators)} criadores, 100% orgânicas, com ${money(A.emv)} em ganho de mídia estimado.`
    : 'Ajuste os filtros acima para ver os resultados.';

  const k = [
    ['Visualizações', n0(A.views), A.posts? `${n0(A.views/A.posts)} por publicação` : '—'],
    ['Alcance', n0(A.reach), 'contas únicas que viram'],
    ['Engajamento', n0(A.engs), 'reações, salvamentos e compartilhamentos'],
    ['Ganho de mídia', money(A.emv), A.creators
       ? `${n1(A.emv*FX/(A.creators*CACHE))}x o cachê de ${brl(A.creators*CACHE)} pago aos ${n0(A.creators)} criadores do recorte`
       : 'equivalente em investimento']
  ];
  $('kpis').innerHTML = k.map(([a,b,c])=>
    `<div class="kpi"><span class="k">${a}</span><span class="v num">${b}</span><span class="s">${c}</span></div>`).join('');
  $('rates').innerHTML = [
    ['Taxa de alcance', pc(A.txa), 'do total de seguidores do squad, alcançado'],
    ['Taxa de engajamento', pc(A.txe), 'de quem foi alcançado, reagiu']
  ].map(([a,b,c])=>`<div class="rate"><span class="k">${a}</span><div class="v num">${b}</div><span class="s">${c}</span></div>`).join('');
}


/* ================= entrega e custo contra o planejado ================= */
/* Constantes do orçamento aprovado e do estimado de UGC, no bloco cifrado. Não vêm da exportação do Sprout. */
const GOAL = D.goal;
function renderGoal(){
  const T = PO.reduce((a,p)=>a+p.v,0);
  const R = PO.reduce((a,p)=>a+(p.r||0),0);
  const E = PO.reduce((a,p)=>a+eng(p),0);
  const nCre = new Set(PO.map(p=>p.c)).size;
  const vids = PO.filter(p=>VIDEO.has(p.f)).length;
  const telas = PO.filter(p=>p.f==='Stories').length;
  const pecasFeitas = vids+telas;
  const pecasPlan = GOAL.ugcN*(GOAL.vidPorUgc+GOAL.telasPorUgc);

  const dia = d => Math.round((new Date(d+'T00:00:00') - new Date(GOAL.inicio+'T00:00:00'))/864e5)+1;
  const diasTot = GOAL.semanas*7, diasMed = dia(DAYS[DAYS.length-1]);
  const semMed = Math.ceil(diasMed/7), semHoje = Math.ceil(dia(GOAL.hoje)/7);

  const impactos = T/GOAL.meta, escopo = pecasFeitas/pecasPlan, prazo = diasMed/diasTot;
  const porPeca = T/pecasFeitas, metaPeca = GOAL.meta/pecasPlan;
  const indice = porPeca/metaPeca;
  const projT = porPeca*pecasPlan, projR = R/pecasFeitas*pecasPlan, projE = E/pecasFeitas*pecasPlan;
  const alocado = GOAL.creator/GOAL.ugcN*nCre;
  const emvBRL = PO.reduce((a,p)=>a+p.emv,0)*FX;

  $('goal').innerHTML = `
    <div class="goal-head">
      <div class="big num">${pc(indice,0)}<small>do impacto estimado por peça</small></div>
      <div class="side">
        <b class="num">${n0(T)}</b> de ${n0(GOAL.meta)} impactos<br>
        com <b class="num">${n0(pecasFeitas)}</b> das ${n0(pecasPlan)} peças publicadas
      </div>
    </div>
    ${[['Impactos entregues',impactos,`${n0(T)} visualizações acumuladas até ${dLong(DAYS[DAYS.length-1])}`,'var(--accent)'],
       ['Escopo de conteúdo executado',escopo,`${n0(vids)} de ${n0(GOAL.ugcN*GOAL.vidPorUgc)} vídeos e ${n0(telas)} de ${n0(GOAL.ugcN*GOAL.telasPorUgc)} telas de stories`,'var(--s2)'],
       ['Prazo consumido no período medido',prazo,`${n0(diasMed)} de ${n0(diasTot)} dias, de ${dLong(GOAL.inicio)} a ${dLong(GOAL.fim)}`,'var(--q2)']
      ].map(([l,v,foot,col])=>`<div class="gbar">
        <div class="gl2"><span>${l}</span><span class="r">${pc(v,0)}</span></div>
        <span class="gtrack"><span class="gfill" style="width:${Math.min(v*100,100).toFixed(1)}%;background:${col}"></span></span>
        <p class="foot">${foot}</p></div>`).join('')}
    <p class="goal-note">A campanha já entregou <b>${pc(impactos,0)}</b> dos impactos estimados tendo publicado apenas <b>${pc(escopo,0)}</b>
    do conteúdo contratado. Cada peça no ar está rendendo <b>${n0(porPeca)}</b> impactos contra ${n0(metaPeca)} previstos.
    <b>${n0(nCre)}</b> dos ${n0(GOAL.ugcN)} criadores já postaram. ${semHoje>semMed
      ? `A medição vai até a semana ${semMed}; hoje a campanha está na semana <b>${semHoje}</b>, então ${semHoje-semMed===1?'a semana '+semHoje+' ainda não entrou':'as semanas '+(semMed+1)+' a '+semHoje+' ainda não entraram'} nesta leitura.`
      : `A base está atualizada até hoje, semana <b>${semHoje}</b> de ${GOAL.semanas}.`}</p>`;

  $('goal-cards').innerHTML = [
    ['Projeção ao fim do escopo', n0(projT),
     `${pc(projT/GOAL.meta,0)} da meta, mantida a média por peça. Alcance projetado de ${n0(projR)} e ${n0(projE)} engajamentos.`],
    ['CPM planejado', brl(GOAL.creator/GOAL.meta*1000),
     `verba de cachê de ${brl(GOAL.creator)} dividida pelos ${n0(GOAL.meta)} impactos estimados`],
    ['CPM projetado', brl(GOAL.creator/projT*1000),
     `${pc(1-(GOAL.creator/projT)/(GOAL.creator/GOAL.meta),0)} abaixo do planejado, se a média por peça se mantiver`],
    ['Retorno sobre o cachê', n1(emvBRL/(nCre*CACHE))+'x',
     `${brl(emvBRL/nCre)} de ganho de mídia por criador contra ${brl(CACHE)} de cachê, dentro do budget de ${brl(GOAL.budget)} aprovado para os ${n0(GOAL.ugcN)} UGCs`]
  ].map(([k,v,s])=>`<div class="gc"><div class="k">${k}</div><div class="v num">${v}</div><span class="s">${s}</span></div>`).join('');

  $('goal-partial').innerHTML = `Custo parcial hoje, com a verba de cachê alocada aos ${n0(nCre)} criadores já ativos
    (${brl(alocado)}): <b>${brl(alocado/T*1000)}</b> de CPM sobre impactos, <b>${brl(alocado/R*1000)}</b> sobre alcance
    e <b>${brl(alocado/E)}</b> por engajamento. Esse número cai conforme as ${n0(pecasPlan-pecasFeitas)} peças restantes entram no ar,
    porque o cachê já está pago e a entrega ainda está em ${pc(escopo,0)}.`;
}

/* ================= duelo Reels x Stories ================= */
function renderDuel(A){
  const host = $('duel');
  const pick = n => A.byGrp.find(x=>x.f===n);
  const tot = {n:A.posts, views:A.views, engs:A.engs};
  const items = ['Reels','Stories'].map(pick).filter(Boolean);
  if(items.length<2){ host.innerHTML = ''; return; }
  const roles = {Reels:'Formato de alcance e conversa', Stories:'Formato de frequência e presença'};
  host.innerHTML = items.map(x=>{
    const rows = [
      ['Das publicações', x.n/tot.n, n0(x.n)+' peças'],
      ['Das visualizações', tot.views? x.views/tot.views : 0, n0(x.views)],
      ['Do engajamento', tot.engs? x.engs/tot.engs : 0, n0(x.engs)]
    ];
    const note = x.f==='Reels'
      ? `Taxa de engajamento de <b>${pc(x.txe)}</b> e taxa de alcance de <b>${pc(x.txa)}</b>. Cada peça rendeu ${n0(x.views/x.n)} visualizações.`
      : `Taxa de engajamento de <b>${pc(x.txe)}</b> e taxa de alcance de <b>${pc(x.txa)}</b>. Cada peça rendeu ${n0(x.views/x.n)} visualizações.`;
    return `<div class="duelc">
      <span class="tag" style="background:${GCOL[x.f]}">${x.f}</span>
      <p class="role">${roles[x.f]||''}</p>
      <div class="duelbars">${rows.map(([l,v,abs])=>
        `<div class="duelbar"><div class="dl"><span>${l}</span><b class="num">${pc(v,0)}</b></div>
          <span class="dt"><span class="df" style="width:${(v*100).toFixed(1)}%;background:${GCOL[x.f]}"></span></span>
          <div class="dl" style="margin:5px 0 0"><span style="font-size:11.5px;color:var(--ink-3)">${abs}</span></div></div>`).join('')}</div>
      <p class="note">${note}</p></div>`;
  }).join('');
}

/* ================= cartões de destaque ================= */
function renderCards(A){
  const host = $('cards');
  const vids = A.rows.filter(p=>VIDEO.has(p.f));
  const semVideo = !vids.length;
  $('dst-eyebrow').textContent = semVideo ? 'Entregas do período' : 'Conteúdos destaque';
  $('dst-h2').textContent = semVideo ? 'Quem entregou neste recorte' : 'As peças que puxaram o resultado';
  $('dst-p').textContent = semVideo
    ? 'O recorte selecionado tem apenas Stories, que saem do ar em 24 horas e por isso não entram como conteúdo destaque. O ranking de criadores está logo abaixo.'
    : 'Cada uma lidera por um motivo diferente. Clique para abrir o conteúdo.';
  if(semVideo){ host.innerHTML=''; return; }
  const byViews = [...vids].sort((a,b)=>b.v-a.v)[0];
  const byTxe = vids.filter(p=>okReach(p)&&p.r>=800).sort((a,b)=>eng(b)/b.r-eng(a)/a.r)[0];
  const byTxa = vids.filter(p=>okReach(p)&&p.fo>=2000).sort((a,b)=>b.r/b.fo-a.r/a.fo)[0];
  const byAw  = vids.filter(p=>p.aw!=null).sort((a,b)=>b.aw-a.aw)[0];
  const picks = [
    ['Maior alcance de tela', byViews, p=>[n0(p.v),'views']],
    ['Maior engajamento', byTxe, p=>[pc(eng(p)/p.r,0),'de quem viu']],
    ['Mais fora da bolha', byTxa, p=>[pc(p.r/p.fo,0),'dos seguidores']],
    ['Maior retenção', byAw, p=>[n1(p.aw)+'s','assistidos']]
  ].filter(x=>x[1]);
  const seen = new Set();
  host.innerHTML = picks.map(([label,p,val])=>{
    const c = CR[p.c]; const [big,unit]=val(p);
    const facts = [`${p.f} · ${dShort(p.d)}`, `${n0(c.f)} seguidores`];
    if(p.r!=null && !p.q.includes('l')) facts.push(`${n0(p.r)} alcançados`);
    return `<div class="hcard">
      <span class="rank">${label}</span>
      <div class="big num">${big}<span>${unit}</span></div>
      <div class="who">${esc(c.n)}<em>@${esc(c.h[0]||'')}</em></div>
      <div class="facts">${facts.map(f=>`<span class="fact">${f}</span>`).join('')}</div>
      <a class="go" href="${esc(p.u)}" target="_blank" rel="noopener">Ver conteúdo ↗</a></div>`;
  }).join('');
}

/* ================= insights ================= */
function renderInsights(A){
  const box = $('reads');
  if(!A.posts){ box.innerHTML=''; return; }
  const peak = [...A.byDay].sort((x,y)=>y.views-x.views)[0];
  const byCre = new Map();
  for(const p of A.rows){ byCre.set(p.c,(byCre.get(p.c)||0)+p.v); }
  const vs=[...byCre.values()].sort((x,y)=>y-x);
  const top10 = vs.slice(0,10).reduce((x,y)=>x+y,0);
  const reels = A.byGrp.find(x=>x.f==='Reels'), stories = A.byGrp.find(x=>x.f==='Stories');
  const cards=[];

  if(reels && stories && reels.txe!=null && stories.txe!=null){
    cards.push({big:(reels.txe/stories.txe).toLocaleString('pt-BR',{maximumFractionDigits:0})+'×',
      cap:'mais engajamento em Reels',
      h:'A conversa mora no Reels',
      p:`Quem viu um Reel reagiu <b>${(reels.txe/stories.txe).toLocaleString('pt-BR',{maximumFractionDigits:0})} vezes mais</b> do que quem viu um Story: taxa de engajamento de <b>${pc(reels.txe)}</b> contra <b>${pc(stories.txe)}</b>. Stories sustentam presença diária; Reels é onde a marca vira assunto.`});
  }
  if(peak && peak.views){
    const lead = Object.entries(peak.seg).sort((x,y)=>y[1]-x[1])[0];
    cards.push({big:pc(peak.views/A.views,0), cap:'da entrega em um único dia',
      h:`${dLong(peak.d)} concentrou a campanha`,
      p:`Foram <b>${n0(peak.views)}</b> visualizações em 24 horas${lead?`, com ${lead[0]} respondendo por ${pc(lead[1]/peak.views,0)} do volume`:''}. A onda de vídeo durou seis dias e carregou o resultado inteiro.`});
  }
  if(vs.length>=10 && A.views){
    cards.push({big:pc(top10/A.views,0), cap:'vem de 10 criadores',
      h:'A entrega é concentrada',
      p:`Entre os <b>${n0(vs.length)}</b> perfis ativados, <b>10</b> respondem por ${pc(top10/A.views,0)} das visualizações. O próximo squad ganha mais em repetir esses perfis do que em ampliar a lista.`});
  }
  box.innerHTML = cards.map(c=>`<div class="read">
    <div class="big num">${c.big}<small>${c.cap}</small></div>
    <div class="txt"><h3>${c.h}</h3><p>${c.p}</p></div></div>`).join('');
}

/* ================= eficiência por formato ================= */
function renderEff(A){
  const host = $('ch-eff'); host.innerHTML='';
  const list = A.byGrp.filter(x=>x.hasReach && (x.txa!=null || x.txe!=null));
  if(!list.length){ host.innerHTML='<p class="empty">Nenhum formato do recorte tem alcance reportado pela plataforma.</p>'; return; }
  const W=hostW(host,760),H=340, padL=58,padB=74,padT=20,padR=10;
  const max = Math.max(...list.flatMap(x=>[x.txa||0,x.txe||0]))*1.20 || .1;
  const s = svg(W,H); host.appendChild(s);
  const bw = W-padL-padR, bh = H-padT-padB;
  const ticks = 4;
  for(let i=0;i<=ticks;i++){
    const v = max*i/ticks, y = padT+bh-bh*i/ticks;
    el('line',{x1:padL,x2:W-padR,y1:y,y2:y,class:'gl'},s);
    txt(pc(v,0), padL-7, y+3.5, 'ax','end', s);
  }
  const slot = bw/list.length;
  list.forEach((f,i)=>{
    const cx = padL + slot*i + slot/2;
    const pair = [['Taxa de alcance',f.txa,'var(--q5)'],['Taxa de engajamento',f.txe,'var(--q1)']];
    const w = Math.min(64, slot/2.9);
    pair.forEach((p,j)=>{
      const [nm,val,col]=p;
      const x = cx - w - 4 + j*(w+8);
      if(val==null){ return; }
      const h = Math.max(bh*(val/max),2);
      const g = el('g',{class:'col'},s);
      el('rect',{x,y:padT+bh-h,width:w,height:h,fill:col,rx:5},g);
      txt(pc(val), x+w/2, padT+bh-h-9, 'vl','middle', g);
      bindTip(el('rect',{x:x-2,y:padT,width:w+4,height:bh,class:'hit'},g),
        `<b>${f.f}</b>`+trow(col,nm,pc(val))+trow(null,'Alcance',n0(f.reach))+trow(null,'Engajamento',n0(f.engs)));
    });
    txt(f.f, cx, H-padB+24, 'vl','middle', s);
    txt(n0(f.n)+(f.n===1?' peça':' peças'), cx, H-padB+40, 'ax','middle', s);
    if(f.small) txt('amostra pequena', cx, H-padB+54, 'ax','middle', s).style.fill='var(--ink-3)';
  });
}

/* ================= curva diária ================= */
function renderDay(A){
  const host = $('ch-day'), hv = $('ch-vol');
  host.innerHTML=''; hv.innerHTML='';
  $('lg-day').innerHTML = A.byGrp.map(x=>`<span class="lg"><i style="background:${GCOL[x.f]}"></i>${x.f}</span>`).join('');
  if(!A.byDay.length || !A.views){ host.innerHTML='<p class="empty">Nenhuma visualização no recorte.</p>'; $('peak-cap').textContent=''; return; }

  const pico = [...A.byDay].sort((a,b)=>b.views-a.views)[0];
  /* acima de duas semanas o dia a dia vira ilegível, então o gráfico agrupa por semana */
  const porSemana = A.days.length > 14;
  let cols;
  if(porSemana){
    cols = PRESETS.filter(p=>p.k!=='all' && p.a<=S.b && p.b>=S.a).map(p=>{
      const ini=Math.max(p.a,S.a), fim=Math.min(p.b,S.b);
      const dias = A.byDay.filter(d=>{ const i=DAYS.indexOf(d.d); return i>=ini && i<=fim; });
      const seg={}; let tot=0,n=0;
      dias.forEach(d=>{ for(const f in d.seg) seg[f]=(seg[f]||0)+d.seg[f]; tot+=d.views; n+=d.n; });
      return {k:p.l, l1:p.l, l2:`${dShort(DAYS[ini])} a ${dShort(DAYS[fim])}`, seg, views:tot, n,
              tip:`${p.l} · ${dLong(DAYS[ini])} a ${dLong(DAYS[fim])}`};
    }).filter(c=>c.n);
  } else {
    cols = A.byDay.map(d=>({k:d.d, l1:dShort(d.d), l2:'', seg:d.seg, views:d.views, n:d.n, tip:dLong(d.d)}));
  }
  const top = [...cols].sort((a,b)=>b.views-a.views)[0];
  $('peak-cap').textContent = `O pico foi em ${dLong(pico.d)}, com ${n0(pico.views)} visualizações, ${pc(pico.views/A.views,0)} de tudo o que a campanha entregou no recorte.`
    + (porSemana ? ' O gráfico está agrupado por semana; selecione uma semana acima para abrir o dia a dia.' : '');

  const W=hostW(host,760), H=340, padL=58, padR=10, padT=28, padB=porSemana?66:46;
  const max = Math.max(...cols.map(d=>d.views))*1.14 || 1;
  const s = svg(W,H); host.appendChild(s);
  const bw = W-padL-padR, bh = H-padT-padB;
  for(let i=0;i<=4;i++){
    const v=max*i/4, y=padT+bh-bh*i/4;
    el('line',{x1:padL,x2:W-padR,y1:y,y2:y,class:'gl'},s);
    txt(v>=1000? n0(v/1000)+'k' : n0(v), padL-8, y+3.5,'ax','end',s);
  }
  const slot = bw/cols.length, cw = Math.min(slot*0.60, porSemana?120:62);
  cols.forEach((d,i)=>{
    const x = padL + slot*i + (slot-cw)/2;
    const g = el('g',{class:'col'},s);
    let y = padT+bh;
    const entries = GORDER.filter(f=>d.seg[f]);
    for(const f of entries){
      const h = bh*(d.seg[f]/max); y -= h;
      el('rect',{x:x.toFixed(2),y:y.toFixed(2),width:cw.toFixed(2),height:Math.max(h,1.5).toFixed(2),
        fill:GCOL[f],class:'seg',rx:h>8?4:1},g);
    }
    if(d.views) txt(d.views>=1000? n1(d.views/1000)+'k' : n0(d.views), x+cw/2, y-9, 'vl','middle', g);
    if(d.k===top.k && d.views)
      el('rect',{x:(x-5).toFixed(2),y:(y-24).toFixed(2),width:(cw+10).toFixed(2),height:(padT+bh-y+24).toFixed(2),
        fill:'none',stroke:'var(--accent)','stroke-width':1.5,rx:6,'stroke-dasharray':'4 3'},g);
    txt(d.l1, x+cw/2, H-padB+(porSemana?22:19), porSemana?'vl':'ax','middle', s);
    if(d.l2) txt(d.l2, x+cw/2, H-padB+40, 'ax','middle', s);
    const body = entries.map(f=>trow(GCOL[f],f,n0(d.seg[f]))).join('');
    bindTip(el('rect',{x:(padL+slot*i).toFixed(2),y:padT,width:slot.toFixed(2),height:bh,class:'hit'},g),
      `<b>${d.tip}</b>`+trow(null,'Visualizações',n0(d.views))+body+trow(null,'Publicações',n0(d.n)));
  });

  $('vol-lbl').textContent = porSemana ? 'Publicações por semana' : 'Publicações por dia';
  /* volume de publicações, escala própria */
  const H2=112, pT=22, pB=20;
  const s2 = svg(W,H2); hv.appendChild(s2);
  const mx = Math.max(...cols.map(d=>d.n)) || 1;
  const bh2 = H2-pT-pB;
  el('line',{x1:padL,x2:W-padR,y1:pT+bh2,y2:pT+bh2,class:'gl'},s2);
  cols.forEach((d,i)=>{
    const x = padL + slot*i + (slot-cw)/2;
    const h = Math.max(bh2*(d.n/mx), d.n?2:0);
    const g = el('g',{class:'col'},s2);
    if(h) el('rect',{x:x.toFixed(2),y:(pT+bh2-h).toFixed(2),width:cw.toFixed(2),height:h.toFixed(2),fill:'var(--q2)',rx:4},g);
    if(d.n) txt(n0(d.n), x+cw/2, pT+bh2-h-7,'vl','middle',g);
    bindTip(el('rect',{x:(padL+slot*i).toFixed(2),y:pT,width:slot.toFixed(2),height:bh2,class:'hit'},g),
      `<b>${d.tip}</b>`+trow(null,'Publicações',n0(d.n))+trow(null,'Visualizações',n0(d.views)));
  });
}

const CTABS = [
  {k:'posts', l:'Mais publicações', cap:'Volume de entregas por criador no recorte. Um criador conta uma vez, mesmo com @ diferentes entre redes.'},

  {k:'engs',  l:'Mais engajamento', cap:'Soma do engajamento de todas as publicações do criador no recorte.'},
  {k:'txe',   l:'Melhor taxa de engajamento', cap:'Engajamento somado dividido pelo alcance somado, com piso de 2 publicações e 500 contas alcançadas.'}
];
function renderCre(A){
  $('tabs-c').innerHTML = CTABS.map(t=>
    `<button class="tab" role="tab" data-k="${t.k}" aria-selected="${S.cTab===t.k}">${t.l}</button>`).join('');
  $('cap-c').textContent = CTABS.find(t=>t.k===S.cTab).cap;

  for(const p of A.rows){

    if(!o){ o={c:p.c,n:0,v:0,r:0,e:0,rr:0,re:0,emv:0,fmts:new Set()}; m.set(p.c,o); }

  + rows.map((o,i)=>{

        <span class="minibar" style="width:${w.toFixed(1)}%"></span></td>

      <td class="num">${n0(o.v)}</td><td class="num">${o.r?n0(o.r):'—'}</td>
      <td class="num">${n0(o.e)}</td><td class="num">${pc(o.txe)}</td></tr>`;
  }).join('') + `</tbody>`;
}

const TIERS = [
  {l:'Nano · até 10 mil', lo:0, hi:10000},
  {l:'Micro · 10 a 50 mil', lo:10000, hi:50000},
  {l:'Mid · 50 a 500 mil', lo:50000, hi:500000},

    return {l:t.l,n:g.length,c:cs.size,v,r,e,txa:rf?rr/rf:null,txe:rr?re/rr:null};

  const t = $('t-tier');

  + `</tbody>`;
}

  for(const p of A.rows){
    const w = p.r!=null? p.r : p.v; if(!w) continue;
    const dm = (CR[p.c].dm||{})[p.pl]; if(!dm || dm[0]==null) continue;
    wTot += w; fem += w*dm[0];
    for(let i=0;i<7;i++) ages[i] += w*(dm[i+1]||0);
  }
  const hbAge = $('hb-age');
  if(!wTot){ hbAge.innerHTML='<p class="empty">Sem demografia no recorte.</p>'; $('ch-gen').innerHTML=''; }
  else {
    const vals = ages.map(a=>a/wTot);
    const mx = Math.max(...vals)||1;
    hbAge.innerHTML = AGE.map((l,i)=>
      `<div class="hb-row"><span class="lbl">${l}</span>
        <span class="hb-track"><span class="hb-fill" style="width:${(vals[i]/mx*100).toFixed(1)}%;background:var(--q3)"></span></span>
        <span class="val">${pc(vals[i]/100)}</span></div>`).join('');
    /* gênero */
    const f = fem/wTot/100, m = 1-f;
    const host = $('ch-gen'); host.innerHTML='';
    const W=hostW(host,440),H=58, s=svg(W,H); host.appendChild(s);
    const segs=[['Feminino',f,'var(--s1)','#fff'],['Masculino',m,'var(--s2)','#03531d']];
    let x=0;
    for(const [nm,val,col,ink] of segs){
      const w = val*W; const g=el('g',{class:'col'},s);
      el('rect',{x:x.toFixed(2),y:6,width:Math.max(w,2).toFixed(2),height:26,fill:col,class:'seg',rx:4},g);
      if(w>66){ txt(pc(val,0), x+w/2, 24,'vl','middle',g).style.fill=ink; }
      txt(nm, x+ (w>66? w/2 : 0), 48, 'ax', w>66?'middle':'start', s);
      bindTip(el('rect',{x:x.toFixed(2),y:0,width:Math.max(w,2).toFixed(2),height:38,class:'hit'},g),
        `<b>${nm}</b>`+trow(col,'Da audiência alcançada',pc(val)));
      x+=w;
    }
  }
  /* geografia dos criadores */
  const cs = new Set(A.rows.map(p=>p.c));
  const uf = new Map();
  for(const i of cs){ const k = CR[i].ufn || 'Não declarado'; uf.set(k,(uf.get(k)||0)+1); }
  uf.delete('Não declarado');
  const totUf = [...uf.values()].reduce((a,b)=>a+b,0);
  const ul = [...uf.entries()].sort((a,b)=>b[1]-a[1]).slice(0,9);
  const mxu = ul.length? ul[0][1] : 1;
  $('hb-uf').innerHTML = ul.length? ul.map(([k,v])=>
    `<div class="hb-row"><span class="lbl" title="${esc(k)}">${esc(k)}</span>
      <span class="hb-track"><span class="hb-fill" style="width:${(v/mxu*100).toFixed(1)}%;background:var(--q3)"></span></span>
      <span class="val">${n0(v)} · ${pc(v/totUf,0)}</span></div>`).join('')
    : '<p class="empty">Nenhum criador do recorte declarou o estado no perfil.</p>';
  $('uf-note').textContent = totUf
    ? `${n0(totUf)} dos ${n0(cs.size)} criadores do recorte declaram o estado no perfil; os demais informam apenas o país.` : '';

  /* praça da audiência: estado que lidera a audiência do criador, ponderado pelo alcance */
  const aud = new Map(); let at=0;
  for(const p of A.rows){
    const w = p.r!=null? p.r : p.v; if(!w) continue;
    const k = ((CR[p.c].st||{})[p.pl]) || 'Não reportado';
    aud.set(k,(aud.get(k)||0)+w); at+=w;
  }
  aud.delete('Não reportado');
  const totAud = [...aud.values()].reduce((a,b)=>a+b,0);
  const al = [...aud.entries()].sort((a,b)=>b[1]-a[1]).slice(0,9);
  const mxa = al.length? al[0][1] : 1;
  $('hb-aud').innerHTML = al.length? al.map(([k,v])=>
    `<div class="hb-row"><span class="lbl" title="${esc(k)}">${esc(k)}</span>
      <span class="hb-track"><span class="hb-fill" style="width:${(v/mxa*100).toFixed(1)}%;background:var(--q2)"></span></span>
      <span class="val">${pc(v/totAud,0)}</span></div>`).join('')
    : '<p class="empty">Sem demografia de praça no recorte.</p>';
}

/* ================= funil de stories ================= */
function renderFunnel(A){
  const g = A.rows.filter(p=>p.f==='Stories');
  const host = $('fn'), kp = $('kpi-story');
  if(!g.length){ host.innerHTML='<p class="empty">Nenhum Story no recorte.</p>'; if(kp) kp.innerHTML=''; $('story-read').textContent=''; return; }
  const v=g.reduce((a,p)=>a+p.v,0), r=g.reduce((a,p)=>a+(p.r||0),0),
        tf=g.reduce((a,p)=>a+p.tf,0), tb=g.reduce((a,p)=>a+p.tb,0),
        ex=g.reduce((a,p)=>a+p.ex,0), re=g.reduce((a,p)=>a+p.re,0);
  const steps = [
    ['Visualizações', v, 'var(--q5)', 'reproduções da sequência'],
    ['Alcance', r, 'var(--q4)', 'contas únicas'],
    ['Avanços', tf, 'var(--q3)', 'seguiram para o próximo'],
    ['Saídas', ex, 'var(--q2)', 'abandonaram a sequência'],
    ['Retornos', tb, 'var(--q1)', 'voltaram para rever'],
    ['Respostas', re, 'var(--s4)', 'conversa na DM']
  ];
  const mx = Math.max(...steps.map(s=>s[1])) || 1;
  host.innerHTML = steps.map(([l,val,col,sub])=>
    `<div class="fn-step"><span class="fn-lbl">${l}</span>
      <span class="fn-trk"><span class="fn-bar" style="width:${Math.max(val/mx*100,1).toFixed(1)}%;background:${col}"></span></span>
      <span class="fn-side"><b>${n0(val)}</b>${sub}</span></div>`).join('');
  const k = [
    ['Taxa de avanço', pc(v?tf/v:null,0), 'avanços ÷ views'],
    ['Taxa de saída', pc(v?ex/v:null,0), 'saídas ÷ views'],
    ['Taxa de retorno', pc(v?tb/v:null,0), 'retornos ÷ views'],
    ['Taxa de alcance', pc((()=>{let a=0,b=0;for(const p of g){if(p.r!=null){a+=p.r;b+=p.fo;}}return b?a/b:null})(),1), 'alcance ÷ seguidores']
  ];
  if(kp) kp.innerHTML = k.map(([a,b,c])=>`<div class="kpi"><span class="k">${a}</span><span class="v num">${b}</span><span class="s">${c}</span></div>`).join('');
  const adv = v?tf/v:0, exr = v?ex/v:0, bak = v?tb/v:0;
  $('story-read').innerHTML = `Com <b>${pc(adv,0)}</b> de avanço contra <b>${pc(exr,0)}</b> de saída, a sequência retém a maior parte de quem entra: a cada pessoa que abandona, cerca de ${n1(exr? adv/exr : 0)} seguem adiante. O retorno de <b>${pc(bak,0)}</b> indica conteúdo que exigiu uma segunda olhada, normalmente informação de produto ou receita, e é o sinal mais útil para decidir o que vale virar Reels na próxima onda.`;
}

/* ================= tabela completa por influenciador ================= */
const ACOLS = [
  {k:'name', l:'Influenciador', t:'txt'},
  {k:'fo',   l:'Seguidores'},
  {k:'n',    l:'Publicações'},
  {k:'nR',   l:'Reels'},
  {k:'nS',   l:'Stories'},
  {k:'nT',   l:'TikTok'},
  {k:'v',    l:'Visualizações'},
  {k:'r',    l:'Alcance'},
  {k:'li',   l:'Curtidas'},
  {k:'co',   l:'Comentários'},
  {k:'sa',   l:'Salvamentos'},
  {k:'sh',   l:'Compart.'},
  {k:'re',   l:'Respostas'},
  {k:'e',    l:'Engajamento'},
  {k:'txa',  l:'Tx. alcance'},
  {k:'txe',  l:'Tx. engaj.'},
  {k:'emv',  l:'EMV'},
  {k:'nLink',l:'Conteúdos perenes'}
];
function renderAll(A){
  const m = new Map();
  for(const p of A.rows){
    let o = m.get(p.c);
    if(!o){ const c=CR[p.c];
      o = {c:p.c, name:c.n, hs:c.h, pl:c.p, fo:c.f, n:0,nR:0,nS:0,nT:0,
           v:0, r:0, li:0, co:0, sa:0, sh:0, re:0, e:0, emv:0, rr:0, rf:0, reng:0, links:[]};
      m.set(p.c,o);
    }
    /* Stories expiram em 24h, então só o conteúdo perene vira link */
    if(VIDEO.has(p.f) && p.u) o.links.push({u:p.u, f:p.f, v:p.v});
    o.n++; o.v+=p.v; o.e+=eng(p); o.emv+=p.emv;
    o.li+=p.li; o.co+=p.co; o.sa+=p.sa; o.sh+=shares(p); o.re+=p.re;
    if(p.f==='Reels') o.nR++; else if(p.f==='Stories') o.nS++;
    else if(p.f==='TikTok'||p.f==='Shorts') o.nT++;
    if(okReach(p)){ o.r+=p.r; o.rr+=p.r; o.rf+=p.fo; o.reng+=eng(p); }
  }
  let rows = [...m.values()];
  rows.forEach(o=>{
    o.txa = o.rf ? o.rr/o.rf : null;
    /* a taxa só aparece quando o alcance confiável cobre a maior parte do engajamento do criador,
       senão numerador e denominador viriam de publicações diferentes e a linha não fecharia */
    const cob = o.e>0 ? o.reng/o.e : 1;
    o.txe = (o.rr && cob>=0.6) ? o.reng/o.rr : null;
    o.r = o.rr || null;
    o.links.sort((a,b)=>b.v-a.v);
    const seen = {};
    o.links.forEach(l=>{ seen[l.f]=(seen[l.f]||0)+1; });
    const used = {};
    o.links.forEach(l=>{ used[l.f]=(used[l.f]||0)+1;
      l.lbl = seen[l.f]>1 ? `${l.f.replace(/s$/,'')} ${used[l.f]}` : l.f.replace(/s$/,''); });
    o.nLink = o.links.length || null;
  });
  const q = S.q.trim().toLowerCase();
  if(q) rows = rows.filter(o => o.name.toLowerCase().includes(q) || o.hs.some(h=>h.toLowerCase().includes(q)));
  const k = S.aSort;
  rows.sort((a,b)=>{
    if(k==='name') return (S.aDir===-1?-1:1) * a.name.localeCompare(b.name,'pt-BR');
    const x=a[k], y=b[k];
    if(x==null && y==null) return a.name.localeCompare(b.name,'pt-BR');
    if(x==null) return 1;                      /* células vazias sempre no fim */
    if(y==null) return -1;
    return S.aDir===-1 ? y-x : x-y;
  });

  $('tcount').textContent = `${n0(rows.length)} de ${n0(m.size)} influenciadores${q?' · filtrado':''}`;
  const t = $('t-all');
  const head = ACOLS.map(c=>{
    const on = S.aSort===c.k ? (S.aDir===-1?'1':'2') : '';
    return `<th class="s${c.k==='name'?' name':''}" data-k="${c.k}" data-on="${on}" title="Ordenar por ${c.l}">${c.l}</th>`;
  }).join('');
  if(!rows.length){
    t.innerHTML = `<thead><tr>${head}</tr></thead><tbody><tr><td class="empty" colspan="${ACOLS.length}">Nenhum influenciador encontrado.</td></tr></tbody>`;
    return;
  }
  t.innerHTML = `<thead><tr>${head}</tr></thead><tbody>` + rows.map(o=>{
    const hd = o.hs.map(h=>'@'+h).join(' · ');
    return `<tr>
      <td class="name">${esc(o.name)}<span class="hdl">${esc(hd)}</span></td>
      <td class="num">${n0(o.fo)}</td>
      <td class="num">${n0(o.n)}</td>
      <td class="num">${o.nR?n0(o.nR):'—'}</td>
      <td class="num">${o.nS?n0(o.nS):'—'}</td>
      <td class="num">${o.nT?n0(o.nT):'—'}</td>
      <td class="num">${n0(o.v)}</td>
      <td class="num">${o.r!=null?n0(o.r):'—'}</td>
      <td class="num">${o.li?n0(o.li):'—'}</td>
      <td class="num">${o.co?n0(o.co):'—'}</td>
      <td class="num">${o.sa?n0(o.sa):'—'}</td>
      <td class="num">${o.sh?n0(o.sh):'—'}</td>
      <td class="num">${o.re?n0(o.re):'—'}</td>
      <td class="num">${n0(o.e)}</td>
      <td class="num">${pc(o.txa)}</td>
      <td class="num">${pc(o.txe)}</td>
      <td class="num">${money(o.emv)}</td>
      <td class="links">${o.links.length
        ? o.links.map(l=>`<a class="plink" href="${esc(l.u)}" target="_blank" rel="noopener" title="Abrir ${l.lbl} de ${esc(o.name)} em nova aba">${l.lbl} <span aria-hidden="true">↗</span></a>`).join('')
        : '<span class="nolink">só Stories</span>'}</td></tr>`;
  }).join('') + `</tbody>`;
}

/* ================= controles ================= */
function renderControls(){
  $('presets').innerHTML = PRESETS.map(p=>{
    const on = S.a===p.a && S.b===p.b;
    return `<button class="pill" type="button" data-a="${p.a}" data-b="${p.b}" aria-pressed="${on}">${p.l} <span style="opacity:.62">${p.sub}</span></button>`;
  }).join('');
  $('chips').innerHTML = GORDER.map(f=>{
    if(!PO.some(p=>gof(p.f)===f)) return '';
    return `<button class="chip" type="button" data-f="${f}" aria-pressed="${S.fmts.has(f)}" style="color:${GCOL[f]}">
      <span class="dot"></span><span style="color:var(--ink-2)">${f}</span></button>`;
  }).join('');
}

function renderMeta(){
  const nP = PO.length, nC = new Set(PO.map(p=>p.c)).size;
  const nH = new Set(CR.flatMap(c=>c.h)).size;
  $('meta-box').innerHTML = `${dLong(DAYS[0])} a ${dLong(DAYS[DAYS.length-1])}<br>${n0(DAYS.length)} dias medidos<br>
    <b>${n0(nP)}</b> publicações<br><b>${n0(nC)}</b> criadores<br>
    <span style="color:var(--ink-3);font-weight:600">Sprout Social · extração ${dLong(D.exp)}</span>`;
  const hc = $('hint-cre'); if(hc) hc.textContent = `${n0(nC)} criadores`;
  const f = $('fnote-base');
  if(f) f.textContent = `Base: exportação de publicações da campanha NESTON UGCS no Sprout Social Influencer Marketing, extraída em ${dLong(D.exp)}, com ${n0(nP)} publicações de ${n0(nC)} criadores entre ${dLong(DAYS[0])} e ${dLong(DAYS[DAYS.length-1])}. As ${n0(nH)} contas da exportação correspondem a ${n0(nC)} criadores, porque quem usa @ diferentes entre redes conta como uma pessoa só.`;
}

/* esconde blocos que ficam sem dado no recorte, em vez de mostrar caixa vazia */
function isEmpty(el){
  if(!el) return true;
  if(el.querySelector('.empty')) return true;
  return !el.children.length && !el.textContent.trim();
}
function prune(){
  document.querySelectorAll('[data-hide-if]').forEach(w=>{
    w.hidden = isEmpty(document.querySelector(w.dataset.hideIf));
  });
  document.querySelectorAll('[data-hide-if-all]').forEach(w=>{
    w.hidden = w.dataset.hideIfAll.split(',').every(sel=>isEmpty(document.querySelector(sel.trim())));
  });
  document.querySelectorAll('details.more').forEach(d=>{
    const body = d.querySelector('.more-body');
    const vivo = [...body.children].some(c=>!c.hidden && !c.classList.contains('sp'));
    d.hidden = !vivo;
  });
}

function render(){
  const A = derive();
  renderControls();
  renderKpis(A); renderDuel(A); renderInsights(A); renderCards(A);
  renderShare(A); renderEff(A); renderFmtTable(A);
  renderDay(A); renderVid(A); renderCre(A);
  renderTier(A); renderAud(A); renderFunnel(A); renderAll(A);
  prune();
  hideTip();
}

/* eventos */
$('presets').addEventListener('click', e=>{
  const b = e.target.closest('button[data-a]'); if(!b) return;
  S.a = +b.dataset.a; S.b = +b.dataset.b; render();
});
$('chips').addEventListener('click', e=>{
  const b = e.target.closest('button[data-f]'); if(!b) return;
  const f = b.dataset.f;
  if(S.fmts.has(f)) S.fmts.delete(f); else S.fmts.add(f);
  if(!S.fmts.size) S.fmts = new Set(GORDER);
  render();
});
$('reset').addEventListener('click', ()=>{
  S.a=0; S.b=DAYS.length-1; S.fmts=new Set(GORDER);
  S.vTab='views'; S.cTab='posts'; S.aSort='v'; S.aDir=-1; S.q=''; $('q').value='';
  render();
});
$('q').addEventListener('input', e=>{ S.q = e.target.value; render(); });
$('t-all').addEventListener('click', e=>{
  const th = e.target.closest('th[data-k]'); if(!th) return;
  const k = th.dataset.k;
  if(S.aSort===k) S.aDir = -S.aDir;
  else { S.aSort = k; S.aDir = (k==='name') ? 1 : -1; }
  render();
});
$('tabs-v').addEventListener('click', e=>{
  const b=e.target.closest('button[data-k]'); if(!b) return; S.vTab=b.dataset.k; render();
});
$('tabs-c').addEventListener('click', e=>{
  const b=e.target.closest('button[data-k]'); if(!b) return; S.cTab=b.dataset.k; render();
});

renderMeta();
renderGoal();
render();
let rt; addEventListener('resize', ()=>{ hideTip(); clearTimeout(rt); rt=setTimeout(render,180); }, {passive:true});
};
</script>

  var f = document.getElementById('gate-f'), pw = document.getElementById('pw'),
      go = document.getElementById('go'), er = document.getElementById('gate-e');

  function bytes(b64){
    var s = atob(b64), u = new Uint8Array(s.length);
    for (var i=0;i<s.length;i++) u[i] = s.charCodeAt(i);
    return u;
  }

        document.getElementById('app').innerHTML = pacote.body;
